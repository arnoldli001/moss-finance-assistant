<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无极 Agent - 多智能体对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d1d1f; height: 100vh; display: flex; }
  /* ============ 侧边栏 ============ */
  #sidebar { width: 260px; background: #1d1d1f; color: #e5e5e7; display: flex; flex-direction: column; flex-shrink: 0; }
  #user-bar { padding: 14px; border-bottom: 1px solid #333; display: flex; gap: 8px; }
  #user-bar input { flex: 1; background: #2c2c2e; border: 1px solid #3a3a3c; color: #e5e5e7; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  #user-bar button { background: #0a84ff; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #user-bar button:hover { background: #0071e3; }
  #session-list { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font-size: 13px; color: #c7c7cc; word-break: break-all; }
  .session-item:hover { background: #2c2c2e; }
  .session-item.active { background: #0a84ff; color: #fff; }
  .session-item .del { float: right; opacity: 0; font-size: 12px; }
  .session-item:hover .del { opacity: 0.7; }
  .session-item .rename { float: right; opacity: 0; font-size: 12px; margin-right: 6px; }
  .session-item:hover .rename { opacity: 0.7; }
  .session-item input.rename-input { width: 100%; background: #1d1d1f; color: #fff; border: 1px solid #0a84ff; padding: 4px 6px; border-radius: 4px; font-size: 13px; }
  #new-session { margin: 8px; padding: 10px; background: #2c2c2e; color: #0a84ff; border: 1px dashed #3a3a3c; border-radius: 8px; cursor: pointer; text-align: center; font-size: 13px; }
  #new-session:hover { background: #3a3a3c; }
  /* 多选切换入口 */
  #session-toggle-bar { padding: 0 8px 8px; }
  #toggle-multi-btn {
    width: 100%; padding: 8px 10px; background: #2c2c2e; color: #e5e5e7;
    border: 1px solid #3a3a3c; border-radius: 6px; cursor: pointer; font-size: 12px;
    transition: all 0.15s;
  }
  #toggle-multi-btn:hover { background: #3a3a3c; color: #fff; }
  #sidebar.multi-mode #toggle-multi-btn { background: #ff3b30; color: #fff; border-color: #ff3b30; }
  #sidebar.multi-mode #new-session { pointer-events: none; opacity: 0.5; }
  /* 多选模式：会话项样式调整 */
  #sidebar.multi-mode .session-item {
    display: flex; align-items: center; gap: 10px;
  }
  #sidebar.multi-mode .session-item .del,
  #sidebar.multi-mode .session-item .rename { display: none !important; }
  .session-chk {
    flex-shrink: 0; width: 16px; height: 16px; cursor: pointer;
    accent-color: #0a84ff; display: none;
  }
  #sidebar.multi-mode .session-chk { display: inline-block; }
  #sidebar.multi-mode .session-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-item.selected { background: #2c3e5a; color: #fff; }
  .session-item.selected.active { background: #0a84ff; }
  /* 多选底部操作栏 */
  #sidebar.multi-mode #session-multi-bar { display: block; }
  #session-multi-bar {
    display: none;
    padding: 10px 12px; border-top: 1px solid #333;
    background: #1d1d1f;
  }
  .smb-count { font-size: 13px; color: #c7c7cc; margin-bottom: 10px; }
  .smb-count #smb-count-num { color: #0a84ff; font-weight: 700; font-size: 15px; }
  .smb-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .smb-btn {
    flex: 1; min-width: 64px; padding: 7px 8px; font-size: 12px;
    background: #2c2c2e; color: #e5e5e7; border: 1px solid #3a3a3c;
    border-radius: 6px; cursor: pointer; transition: all 0.15s;
  }
  .smb-btn:hover { background: #3a3a3c; color: #fff; }
  .smb-btn.smb-delete {
    background: #ff3b30; color: #fff; border-color: #ff3b30;
  }
  .smb-btn.smb-delete:hover { background: #d70015; }
  .smb-btn.smb-delete:disabled { opacity: 0.5; cursor: not-allowed; background: #7a3030; }
  #sidebar-files-btn { padding: 10px; border-top: 1px solid #333; cursor: pointer; font-size: 13px; text-align: center; }
  #sidebar-files-btn:hover { background: #2c2c2e; }
  /* ============ 主区域 ============ */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header { background: #fff; padding: 12px 20px; border-bottom: 1px solid #d2d2d7; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  #header .brand { font-size: 18px; font-weight: 700; color: #0071e3; white-space: nowrap; }
  #header .title { font-size: 15px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #upload-btn { background: #f5f5f7; border: 1px solid #d2d2d7; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #upload-btn:hover { background: #e8e8ed; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg-wrap { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 16px; }
  .msg-wrap.user-msg { justify-content: flex-end; }
  .msg-wrap.ai-msg { justify-content: flex-start; }
  .msg-wrap.system-wrap, .msg-wrap.event-wrap, .msg-wrap.error-wrap { justify-content: center; }
  .msg { max-width: 80%; margin-bottom: 0; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; position: relative; }
  .msg.user { background: #0a84ff; color: #fff; margin-left: auto; }
  .msg.assistant { background: #fff; border: 1px solid #e5e5e7; margin-right: auto; }
  .msg.event { background: #fff8e1; border-left: 3px solid #ffb300; font-size: 12px; color: #6b6b6b; max-width: 90%; }
  .msg.error { background: #ffeaea; border-left: 3px solid #ff3b30; font-size: 12px; color: #c00; }
  .msg.system { background: #e8f5e9; border-left: 3px solid #34c759; font-size: 12px; color: #2e7d32; }
  /* 消息操作栏（hover显示复制） */
  .msg-actions { display: flex; flex-direction: column; gap: 4px; opacity: 0; transition: opacity 0.2s; padding-top: 6px; flex-shrink: 0; }
  .msg-wrap:hover .msg-actions { opacity: 1; }
  .msg-action-btn {
    width: 28px; height: 28px; border: none; background: #f5f5f7; border-radius: 6px;
    cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
    color: #6b6b6b;
  }
  .msg-action-btn:hover { background: #e5e5e7; color: #0a84ff; }
  .msg-action-btn.copied { background: #34c759; color: #fff; }
  /* 长按触觉反馈 */
  .msg.pressing { transition: transform 0.1s; transform: scale(0.97); }
  /* 自定义上下文菜单 */
  #context-menu {
    position: fixed; z-index: 9999; background: #fff; border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18); padding: 6px 0; min-width: 220px;
    max-width: 260px;
  }
  #context-menu .ctx-item {
    display: flex; align-items: center; gap: 14px; padding: 11px 18px;
    cursor: pointer; font-size: 15px; color: #1d1d1f; user-select: none;
  }
  #context-menu .ctx-item:hover { background: #f5f5f7; }
  #context-menu .ctx-item .ctx-icon { font-size: 20px; width: 24px; text-align: center; }
  #context-menu .ctx-item .ctx-label { flex: 1; }
  #context-menu .ctx-item .ctx-arrow { color: #c7c7cc; font-size: 16px; }
  #context-menu .ctx-divider { height: 1px; background: #f2f2f7; margin: 4px 0; }
  #context-menu .ctx-item.disabled { color: #c7c7cc; pointer-events: none; }
  #context-menu .ctx-item.danger { color: #ff3b30; }
  #context-menu .ctx-item.danger:hover { background: #ffeaea; }
  .ctx-submenu {
    position: absolute; right: 100%; top: -6px; background: #fff; border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18); padding: 6px 0; min-width: 200px;
    display: none;
    margin-right: 6px;
  }
  .ctx-item.has-submenu.open-right .ctx-submenu {
    left: 100%; right: auto; margin-right: 0; margin-left: 6px;
  }
  .ctx-item.has-submenu.open .ctx-submenu { display: block; }
  /* 桌面端 hover 也触发，移动端点击触发 */
  @media (hover: hover) and (pointer: fine) {
    .ctx-item.has-submenu:hover .ctx-submenu { display: block; }
  }
  /* Loading spinner */
  .loading-spinner {
    display: inline-block; width: 16px; height: 16px; border: 2px solid #e5e5e7;
    border-top-color: #0a84ff; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Toast 提示 */
  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8);
    color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 9999;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #input-bar { background: #fff; padding: 12px 20px; border-top: 1px solid #d2d2d7; display: flex; flex-direction: column; gap: 8px; }
  #input-row { display: flex; gap: 10px; }
  #query-input { flex: 1; border: 1px solid #d2d2d7; border-radius: 8px; padding: 10px 14px; font-size: 14px; resize: none; height: 44px; max-height: 120px; }
  #send-btn { background: #0a84ff; color: #fff; border: none; padding: 0 24px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send-btn:hover { background: #0071e3; }
  #send-btn:disabled { background: #b0b0b5; cursor: not-allowed; }
  /* 快捷操作栏（底部左侧） */
  #quick-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #pre-market-btn, #zsxq-hot-btn {
    background: #f5f5f7; color: #1d1d1f; border: 1px solid #d2d2d7;
    padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 13px;
    transition: all 0.15s;
  }
  #pre-market-btn:hover, #zsxq-hot-btn:hover { background: #0a84ff; color: #fff; border-color: #0a84ff; }
  #pre-market-btn:disabled, #zsxq-hot-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* ============ 弹窗 ============ */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: 560px; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 14px; }
  .modal .close { float: right; cursor: pointer; color: #8e8e93; font-size: 20px; }
  .file-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f2f2f7; font-size: 13px; }
  .file-row a { color: #0a84ff; text-decoration: none; }
  .file-row .size { color: #8e8e93; font-size: 12px; }
  #drop-zone { border: 2px dashed #d2d2d7; border-radius: 8px; padding: 24px; text-align: center; color: #8e8e93; margin-bottom: 12px; cursor: pointer; }
  #drop-zone.dragover { border-color: #0a84ff; background: #f0f7ff; }
  #file-input { display: none; }
  .badge { display: inline-block; background: #34c759; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }

  /* ============ 移动端响应式（手机/平板）============ */
  /* 侧边栏缩至 10%，主区域占 90%；侧边栏改为图标式垂直布局 */
  @media (max-width: 768px) {
    #sidebar { width: 10%; min-width: 40px; }
    /* 用户ID栏：改为垂直图标式 */
    #user-bar { flex-direction: column; padding: 8px 4px; gap: 4px; }
    #user-bar input {
      font-size: 10px; padding: 4px 2px; text-align: center; border-radius: 4px;
      min-width: 0;
    }
    #user-bar button { padding: 6px 2px; font-size: 11px; border-radius: 4px; }
    /* 新建会话按钮：改为 + 图标 */
    #new-session { margin: 4px; padding: 8px 2px; font-size: 18px; border-radius: 6px; }
    /* 会话列表：窄列显示 */
    #session-list { padding: 4px 2px; }
    .session-item {
      padding: 6px 2px; font-size: 10px; text-align: center;
      border-radius: 4px; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-item .del, .session-item .rename { display: none; }
    .session-item input.rename-input { font-size: 10px; padding: 2px; }
    /* 文件管理按钮 */
    #sidebar-files-btn { padding: 8px 2px; font-size: 16px; }
    /* 主区域占 90% */
    #main { flex: 1; }
    #header { padding: 8px 10px; gap: 8px; }
    #header .brand { font-size: 14px; }
    #header .title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #upload-btn { padding: 4px 8px; font-size: 11px; }
    #chat { padding: 10px; }
    .msg { max-width: 95%; font-size: 13px; padding: 8px 12px; }
    #input-bar { padding: 8px 10px; gap: 6px; }
    #query-input { font-size: 13px; height: 40px; padding: 8px 10px; }
    #send-btn { padding: 0 14px; font-size: 12px; }
    /* 弹窗适配 */
    .modal { width: 92vw; padding: 14px; }
    #drop-zone { padding: 16px; font-size: 13px; }
    /* 多选模式下：侧边栏展开为 85% 宽，覆盖主区域，确保按钮可正常点击 */
    #sidebar.multi-mode {
      width: 85%;
      position: absolute;
      z-index: 100;
      height: 100vh;
      box-shadow: 2px 0 12px rgba(0,0,0,0.3);
    }
    #sidebar.multi-mode .session-item {
      padding: 10px 12px; font-size: 13px; text-align: left;
    }
    #sidebar.multi-mode .smb-btn {
      min-width: auto; padding: 8px 10px; font-size: 12px;
    }
    #sidebar.multi-mode #toggle-multi-btn { font-size: 13px; padding: 10px; }
  }
</style>
</head>
<body>
  <!-- ============ 侧边栏 ============ -->
  <div id="sidebar">
    <div id="user-bar">
      <input id="user-id-input" placeholder="输入用户ID" />
      <button id="login-btn">登录</button>
    </div>
    <div id="new-session" onclick="newSession()">+ 新建会话</div>
    <div id="session-toggle-bar">
      <button id="toggle-multi-btn" onclick="toggleSessionMultiMode()">🗂 多选删除</button>
    </div>
    <div id="session-list"></div>
    <!-- 多选操作栏 -->
    <div id="session-multi-bar">
      <div class="smb-count">已选 <span id="smb-count-num">0</span> 项</div>
      <div class="smb-actions">
        <button class="smb-btn smb-select-all" onclick="selectAllSessions(true)">全选</button>
        <button class="smb-btn smb-clear" onclick="selectAllSessions(false)">清除</button>
        <button class="smb-btn smb-delete" onclick="confirmDeleteSelectedSessions()">🗑 删除所选</button>
        <button class="smb-btn smb-cancel" onclick="toggleSessionMultiMode(false)">取消</button>
      </div>
    </div>
    <div id="sidebar-files-btn" onclick="openFilesModal()">📁 文件管理</div>
  </div>

  <!-- ============ 主区域 ============ -->
  <div id="main">
    <div id="header">
      <div class="brand">无极 Agent</div>
      <div class="title" id="session-title">未选择会话</div>
      <button id="upload-btn" onclick="openUploadModal()">📤 上传文件</button>
    </div>
    <div id="chat">
      <div class="msg system">欢迎使用无极 Agent，输入问题即可开始对话。</div>
    </div>
    <div id="input-bar">
      <div id="input-row">
        <textarea id="query-input" placeholder="输入问题，Enter 发送，Shift+Enter 换行" disabled></textarea>
        <button id="send-btn" disabled>发送</button>
      </div>
      <div id="quick-actions">
        <button id="pre-market-btn" onclick="sendPreMarketNews()">📰 盘前新闻</button>
        <button id="zsxq-hot-btn" onclick="sendZsxqHotNews()">🔥 盘前小作文热度</button>
      </div>
    </div>

    <!-- ============ 自定义上下文菜单 ============ -->
    <div id="context-menu" style="display:none;">
      <div class="ctx-item" data-action="copy">
        <span class="ctx-icon">📋</span>
        <span class="ctx-label">复制</span>
      </div>
      <div class="ctx-item" data-action="select-text">
        <span class="ctx-icon">☐</span>
        <span class="ctx-label">选择文本</span>
      </div>
      <div class="ctx-item" data-action="regenerate" id="ctx-regenerate">
        <span class="ctx-icon">🔄</span>
        <span class="ctx-label">重新生成</span>
      </div>
      <div class="ctx-divider"></div>
      <div class="ctx-item has-submenu" data-action="share" id="ctx-share">
        <span class="ctx-icon">📤</span>
        <span class="ctx-label">分享</span>
        <span class="ctx-arrow">‹</span>
        <div class="ctx-submenu">
          <div class="ctx-item" data-action="share-image">
            <span class="ctx-icon">🖼️</span>
            <span class="ctx-label">生成分享图片</span>
          </div>
          <div class="ctx-item" data-action="share-text">
            <span class="ctx-icon">📄</span>
            <span class="ctx-label">复制为文字</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 图片预览覆盖层（分享图片用） ============ -->
  <div id="image-preview-overlay" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.9);flex-direction:column;align-items:center;justify-content:center;padding:20px;">
    <div style="color:#fff;font-size:14px;margin-bottom:12px;text-align:center;">长按图片可保存到相册，再从相册分享</div>
    <img id="image-preview-img" src="" style="max-width:90%;max-height:75vh;border-radius:8px;object-fit:contain;" />
    <div style="margin-top:16px;display:flex;gap:12px;">
      <button id="image-preview-save" style="padding:10px 24px;background:#4CAF50;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">保存图片</button>
      <button id="image-preview-close" style="padding:10px 24px;background:#666;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">关闭</button>
    </div>
  </div>

  <!-- ============ 上传弹窗 ============ -->
  <div class="modal-mask" id="upload-modal">
    <div class="modal">
      <span class="close" onclick="closeModal('upload-modal')">×</span>
      <h3>上传文件到当前会话</h3>
      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        点击或拖拽文件到此处上传
      </div>
      <input type="file" id="file-input" multiple />
      <div id="upload-result"></div>
    </div>
  </div>

  <!-- ============ 文件列表弹窗 ============ -->
  <div class="modal-mask" id="files-modal">
    <div class="modal">
      <span class="close" onclick="closeModal('files-modal')">×</span>
      <h3>当前会话文件列表</h3>
      <div id="files-list"></div>
    </div>
  </div>

  <!-- ============ Toast 提示 ============ -->
  <div id="toast"></div>

<script>
// ============ 全局状态 ============
let currentUserId = localStorage.getItem('dsp_user_id') || '';
let currentSessionId = null;
let ws = null;
let isRunning = false;
let currentTaskType = 'normal'; // 'normal' | 'zsxq'，控制 task_result 靠左/靠右显示
let wsReconnectCount = 0;
let _wsReconnectMsg = null;  // 重连提示消息元素（复用，避免多条）
let wsHeartbeatTimer = null;
let runningTimeoutTimer = null;
const WS_HEARTBEAT_INTERVAL = 30000;  // 30秒心跳
const WS_MAX_RECONNECT = 3;            // 最大重连次数
const RUNNING_TIMEOUT = 300000;        // 5分钟超时保护

const $ = id => document.getElementById(id);

// ============ 初始化 ============
window.addEventListener('load', async () => {
  // 首次打开自动生成随机用户 ID，用户无需手动输入
  if (!currentUserId) {
    const ts = Date.now().toString(36);
    const rand = Math.random().toString(36).slice(2, 6);
    currentUserId = 'guest_' + ts + rand;
    localStorage.setItem('dsp_user_id', currentUserId);
  }
  $('user-id-input').value = currentUserId;
  // 自动登录
  await login();
  // 登录后若无会话选中：优先选最后一个已有会话，无会话才新建
  if (!currentSessionId) {
    const sessions = await loadSessions();
    if (sessions.length > 0) {
      const last = sessions[sessions.length - 1];
      switchSession(last.session_id, last.title);
    } else {
      await newSession();
    }
  }
  $('login-btn').addEventListener('click', login);
  $('send-btn').addEventListener('click', sendMessage);
  $('query-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  // 文件上传拖拽
  const dz = $('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); uploadFiles(e.dataTransfer.files); });
  $('file-input').addEventListener('change', e => uploadFiles(e.target.files));
});

// ============ 会话列表（多选） ============
let sessionMultiMode = false;
let selectedSessionIds = new Set();

async function toggleSessionMultiMode(force) {
  const next = typeof force === 'boolean' ? force : !sessionMultiMode;
  sessionMultiMode = next;
  const sb = $('sidebar');
  if (next) sb.classList.add('multi-mode');
  else {
    sb.classList.remove('multi-mode');
    selectedSessionIds.clear();
  }
  // 重新渲染列表（切换 复选框 DOM 结构）
  await loadSessions();
}

function updateMultiBarCount() {
  const el = $('smb-count-num');
  if (el) el.textContent = String(selectedSessionIds.size);
  const delBtn = document.querySelector('.smb-delete');
  if (delBtn) delBtn.disabled = selectedSessionIds.size === 0;
}

function updateSessionSelectionUI() {
  document.querySelectorAll('.session-item').forEach(item => {
    const sid = item.dataset.sid;
    const chk = item.querySelector('.session-chk');
    if (selectedSessionIds.has(sid)) {
      item.classList.add('selected');
      if (chk) chk.checked = true;
    } else {
      item.classList.remove('selected');
      if (chk) chk.checked = false;
    }
  });
  updateMultiBarCount();
}

function toggleSessionSelect(sid, e) {
  if (!sessionMultiMode) return;
  if (e) e.stopPropagation();
  if (selectedSessionIds.has(sid)) selectedSessionIds.delete(sid);
  else selectedSessionIds.add(sid);
  updateSessionSelectionUI();
}

function selectAllSessions(select) {
  document.querySelectorAll('.session-item').forEach(item => {
    const sid = item.dataset.sid;
    if (!sid) return;
    if (select) selectedSessionIds.add(sid);
    else selectedSessionIds.delete(sid);
  });
  updateSessionSelectionUI();
}

let _deleteConfirmTimer = null;
async function confirmDeleteSelectedSessions() {
  const delBtn = document.querySelector('.smb-delete');
  if (selectedSessionIds.size === 0) { showToast('请先选择要删除的会话'); return; }

  // 二次确认：第一次点击改变按钮文字+样式，3 秒内再点才真正删除
  // 按钮状态变化比 toast 更直观，避免手机端用户错过提示
  if (!_deleteConfirmTimer) {
    const count = selectedSessionIds.size;
    if (delBtn) {
      delBtn.textContent = `⚠️ 再次点击确认删除 ${count} 项`;
      delBtn.style.background = '#ff9500';
      delBtn.style.border = '1px solid #ff9500';
      delBtn.style.color = '#fff';
    }
    showToast(`再次点击确认删除 ${count} 个会话`, 3000);
    _deleteConfirmTimer = setTimeout(() => {
      _deleteConfirmTimer = null;
      if (delBtn) {
        delBtn.textContent = '🗑 删除所选';
        delBtn.style.background = '';
        delBtn.style.border = '';
        delBtn.style.color = '';
      }
    }, 3000);
    return;
  }
  clearTimeout(_deleteConfirmTimer);
  _deleteConfirmTimer = null;
  if (delBtn) {
    delBtn.textContent = '🗑 删除所选';
    delBtn.style.background = '';
    delBtn.style.border = '';
    delBtn.style.color = '';
  }

  const ids = Array.from(selectedSessionIds);
  const containedCurrent = ids.includes(currentSessionId);
  showToast('正在删除...');
  try {
    let okCount = 0, failCount = 0;
    for (const sid of ids) {
      const resp = await fetch(`/api/sessions/${sid}`, { method: 'DELETE' });
      if (resp.ok) okCount++;
      else failCount++;
    }
    if (containedCurrent) {
      currentSessionId = null;
      $('session-title').textContent = '未选择会话';
      $('query-input').disabled = true;
      $('send-btn').disabled = true;
      $('chat').innerHTML = '<div class="msg system">会话已删除，请新建或选择其他会话。</div>';
    }
    selectedSessionIds.clear();
    sessionMultiMode = false;
    $('sidebar').classList.remove('multi-mode');
    await loadSessions();
    if (failCount > 0) showToast(`已删除 ${okCount} 个，${failCount} 个失败`, 3000);
    else showToast(`已删除 ${okCount} 个会话`);
  } catch (err) {
    console.error('批量删除失败', err);
    showToast('批量删除失败: ' + (err.message || String(err)));
  }
}

async function loadSessions() {
  if (!currentUserId) return [];
  try {
    const r = await fetch(`/api/users/${currentUserId}/sessions`);
    const data = await r.json();
    const sessions = data.sessions || [];
    const list = $('session-list');
    list.innerHTML = '';
    // 过滤掉已被标记删除的选中项（防止 loadSessions 刷新后 UI 错乱）
    const remainSelected = new Set();
    (data.sessions || []).forEach(s => {
      if (selectedSessionIds.has(s.session_id)) remainSelected.add(s.session_id);
      const div = document.createElement('div');
      div.className = 'session-item' + (s.session_id === currentSessionId ? ' active' : '');
      div.dataset.sid = s.session_id;
      // 多选模式：点击整体切换选中，不切换会话；不绑定默认 onclick/ondblclick
      if (sessionMultiMode) {
        div.innerHTML = `
          <input type="checkbox" class="session-chk" ${selectedSessionIds.has(s.session_id) ? 'checked' : ''} onclick="event.stopPropagation();toggleSessionSelect('${s.session_id}',event)" />
          <span class="session-title">${escapeHtml(s.title || '新会话')}</span>
        `;
        div.onclick = (e) => { e.stopPropagation(); toggleSessionSelect(s.session_id, e); };
        if (selectedSessionIds.has(s.session_id)) div.classList.add('selected');
      } else {
        div.innerHTML = `
          <span class="session-title">${escapeHtml(s.title || '新会话')}</span>
          <span class="rename" onclick="event.stopPropagation();startRename(this,'${s.session_id}','${escapeHtml(s.title||'')}')">✏</span>
          <span class="del" onclick="event.stopPropagation();deleteSession('${s.session_id}')">🗑</span>
        `;
        div.onclick = () => switchSession(s.session_id, s.title);
        div.ondblclick = () => startRename(div.querySelector('.session-title') ? div : null, s.session_id, s.title || '');
      }
      list.appendChild(div);
    });
    selectedSessionIds = remainSelected;
    updateMultiBarCount();
    return sessions;
  } catch (e) { console.error('加载会话列表失败', e); return []; }
}

async function newSession() {
  if (!currentUserId) { alert('请先登录'); return; }

  const uuidFrag = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)).slice(0, 8);
  const randomTitle = `session_${ts}_${uuidFrag}`;

// ============ 会话重命名 ============
function startRename(elem, sid, oldTitle) {
  // elem 可能是 .rename 图标或 .session-item div
  const item = elem.classList && elem.classList.contains('session-item') ? elem : elem.closest('.session-item');
  if (!item) return;
  const titleSpan = item.querySelector('.session-title');
  if (!titleSpan) return;
  const oldText = oldTitle || titleSpan.textContent || '';
  // 替换为输入框
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'rename-input';
  input.value = oldText;
  titleSpan.replaceWith(input);
  input.focus();
  input.select();
  // 隐藏操作按钮
  const btns = item.querySelectorAll('.rename, .del');
  btns.forEach(b => b.style.display = 'none');
  // Enter 提交，Escape 取消，blur 提交
  let done = false;
  const finish = async (submit) => {
    if (done) return;
    done = true;
    const newTitle = input.value.trim();
    if (submit && newTitle && newTitle !== oldText) {
      try {
        await fetch(`/api/sessions/${sid}/title`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({title: newTitle})
        });
        // 更新头部标题（如果是当前会话）
        if (sid === currentSessionId) $('session-title').textContent = newTitle;
      } catch (e) { alert('重命名失败: ' + e.message); }
    }
    await loadSessions(); // 刷新列表（恢复 span 显示）
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

// ============ 切换会话 ============
async function switchSession(sid, title) {
  currentSessionId = sid;
  $('session-title').textContent = title || '未命名会话';
  $('query-input').disabled = false;

  // 这样用户可以在不同会话间快速切换并立即发新任务（支持多标签页/多会话并发）
  isRunning = false;

  clearThinkingTimer();

  // 清空聊天区

    $('chat').innerHTML = `<div class="msg error">加载历史失败: ${e.message}</div>`;
  }
  // 建立 WebSocket
  connectWS(sid);
  await loadSessions(); // 刷新高亮
}

// ============ WebSocket ============
function connectWS(sid) {
  // 清除旧 ws 的回调，避免关闭时触发重连/错误提示（用户主动切换会话不应被当作异常断连）
  if (ws) {
    ws.onclose = null;
    ws.onerror = null;
    ws.onmessage = null;
    ws.onopen = null;
    try { ws.close(); } catch(e){}
    ws = null;
  }
  clearHeartbeat();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${sid}`);

  ws.onopen = () => {
    console.log('WS connected');
    wsReconnectCount = 0;  // 连接成功后重置重连计数
    // 连接恢复后清除重连提示
    if (_wsReconnectMsg) { _wsReconnectMsg.remove(); _wsReconnectMsg = null; }
    startHeartbeat();
  };

  ws.onmessage = e => {
    try {
      const payload = JSON.parse(e.data);
      handleWSMessage(payload);
    } catch (err) { console.warn('WS 消息解析失败', err); }
  };

  ws.onclose = () => {
    console.log('WS closed');
    clearHeartbeat();
    // 自动重连（有当前会话且未超最大重试次数）
    if (wsReconnectCount < WS_MAX_RECONNECT && currentSessionId) {
      wsReconnectCount++;
      const delay = 2000 * wsReconnectCount;
      console.log(`WS ${wsReconnectCount}/${WS_MAX_RECONNECT} 重连中（${delay}ms 后）...`);
      // 任务运行中断连：只显示一条重连提示（复用已有消息元素）
      if (isRunning) {
        if (!_wsReconnectMsg) {
          _wsReconnectMsg = appendMessage('system', `连接中断，正在尝试重连（${wsReconnectCount}/${WS_MAX_RECONNECT}）...`);
        } else if (_wsReconnectMsg) {
          _wsReconnectMsg.textContent = `连接中断，正在尝试重连（${wsReconnectCount}/${WS_MAX_RECONNECT}）...`;
        }
        setTimeout(() => {
          // 重连后若 WebSocket 恢复则清除提示；否则报错
          if (ws && ws.readyState === WebSocket.OPEN) {
            if (_wsReconnectMsg) { _wsReconnectMsg.textContent = '连接已恢复'; setTimeout(() => { if (_wsReconnectMsg) { _wsReconnectMsg.remove(); _wsReconnectMsg = null; } }, 2000); }
          } else if (isRunning) {
            appendMessage('error', '⚠️ WebSocket 重连失败，任务状态可能丢失。可尝试重新发送。');
            setRunning(false);
            _wsReconnectMsg = null;
          }
        }, delay + 1000);
      }
      setTimeout(() => { if (currentSessionId) connectWS(currentSessionId); }, delay);
    } else if (isRunning) {
      // 超过重连次数，直接报错
      appendMessage('error', '⚠️ WebSocket 连接断开，任务状态可能丢失。可尝试重新发送。');
      setRunning(false);
      _wsReconnectMsg = null;
    }
  };

  ws.onerror = err => { console.error('WS error', err); };
}

function startHeartbeat() {
  clearHeartbeat();
  wsHeartbeatTimer = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('ping');
    }
  }, WS_HEARTBEAT_INTERVAL);
}

function clearHeartbeat() {
  if (wsHeartbeatTimer) {
    clearInterval(wsHeartbeatTimer);
    wsHeartbeatTimer = null;
  }
}

function handleWSMessage(p) {
  // 心跳响应忽略
  if (p.type === 'pong') return;
  // monitor 事件
  if (p.type === 'monitor_event') {
    const ev = p.event;
    const msg = p.message;
    if (ev === 'session_created') {
      // 工作目录创建提示，前端静默忽略
    } else if (ev === 'assistant_call') {
      // 子智能体调用提示，前端静默忽略
    } else if (ev === 'thinking') {
      // 只显示一次"思考中"，后续只更新计时
      stopProgressTimer();  // 停止通用进度提示，避免重复
      if (!thinkingEl) {
        thinkingEl = appendMessage('event', '💭 ' + msg + '（已耗时 0 秒）');
        thinkingEl.setAttribute('data-base', '💭 ' + msg);  // 保存原始前缀
        thinkingStartTime = Date.now();
        updateThinkingTimer();
      }
    } else if (ev === 'tool_start') {
      // 工具执行提示，前端静默忽略
    } else if (ev === 'task_result') {
      // 最终结果
      clearThinkingTimer();
      const result = (p.data && p.data.result) ? p.data.result : msg;
      // 盘前小作文热度结果靠右显示，普通任务结果靠左
      const resultRole = currentTaskType === 'zsxq' ? 'user' : 'assistant';
      currentTaskType = 'normal';
      appendMessage(resultRole, result);
      setRunning(false);
      // 刷新会话列表（标题可能已更新）
      loadSessions();
    } else if (ev === 'error') {
      clearThinkingTimer();
      appendMessage('error', '❌ ' + msg);
      setRunning(false);
    } else {
      appendMessage('event', msg);
    }
  }
}

function setRunning(v) {

  if (preBtn) preBtn.disabled = v;
  const hotBtn = $('zsxq-hot-btn');

  if (runningTimeoutTimer) {
    clearTimeout(runningTimeoutTimer);
    runningTimeoutTimer = null;
  }
  if (v) {
    // 启动进度提示（5 秒后若无响应，显示"AI 正在思考中..."）
    startProgressTimer();
    runningTimeoutTimer = setTimeout(() => {
      if (isRunning) {
        appendMessage('error', '⚠️ 任务执行超时（5 分钟），已自动解锁。如需继续请重新发送。');
        setRunning(false);
      }
    }, RUNNING_TIMEOUT);
  } else {
    // 任务结束，停止进度提示
    stopProgressTimer();
  }
}

// ============ Toast 提示 ============
function showToast(text, duration = 2000) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ============ 上下文菜单状态 ============
let currentContextMsg = null;  // 当前操作的消息 DOM 元素
let currentContentEl = null;  // 当前操作的 .msg 元素（用于文本选择）
let currentContextContent = '';
let currentContextRole = '';
let longPressTimer = null;
let longPressStartX = 0, longPressStartY = 0;
const LONG_PRESS_DURATION = 500;  // 长按判定时间(ms)
const LONG_PRESS_MOVE_TOLERANCE = 10;  // 移动容忍像素
let msgIdCounter = 0;

// ============ 消息渲染 ============
// ============ 前端清理：移除不应展示给用户的规则/指令段落 ============
// 正则：匹配换行+【工作环境指令】开始到文本结尾的全部内容（含上传文件、规则1-4等）
const HIDE_PROMPT_RE = /(?:\r?\n)\s*【工作环境指令】[\s\S]*$/;
function stripHiddenInstructions(text) {
  if (typeof text !== 'string') return text;
  return text.replace(HIDE_PROMPT_RE, '').trimEnd();
}

function appendMessage(role, content) {
  // 前端防御：剥掉不应显示给用户的规则段落
  if (role === 'user') content = stripHiddenInstructions(content);
  if (role === 'assistant') content = stripHiddenInstructions(content);

  const chat = $('chat');
  const msgId = 'msg_' + (++msgIdCounter) + '_' + Date.now().toString(36);

  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (role === 'user' ? 'user-msg' : role === 'assistant' ? 'ai-msg' : role + '-wrap');
  wrap.dataset.msgId = msgId;
  wrap.dataset.role = role;
  wrap.dataset.content = content;

  // 占位：保持对齐（替代原复选框位置）
  const spacer = document.createElement('div');
  spacer.style.width = '18px';
  spacer.style.flexShrink = '0';
  wrap.appendChild(spacer);

  // 消息主体
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;

  // 绑定长按 + 右键菜单事件（仅 user/assistant 消息）
  if (role === 'user' || role === 'assistant') {
    bindContextMenu(div, content, role);
  }

  wrap.appendChild(div);

  // hover 复制按钮
  if (role === 'user' || role === 'assistant') {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-action-btn';
    copyBtn.title = '复制内容';
    copyBtn.innerHTML = '📋';
    copyBtn.onclick = async (e) => {
      e.stopPropagation();
      await copyText(content);
      copyBtn.classList.add('copied');
      copyBtn.innerHTML = '✓';
      setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = '📋'; }, 1500);
    };
    actions.appendChild(copyBtn);
    wrap.appendChild(actions);
  }

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// ============ 绑定长按/右键上下文菜单 ============
function bindContextMenu(msgEl, content, role) {
  // 桌面端：右键
  msgEl.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    showContextMenu(e.clientX, e.clientY, content, role, msgEl);
  });

  // 移动端：长按
  msgEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    longPressStartX = t.clientX;
    longPressStartY = t.clientY;
    longPressTimer = setTimeout(() => {
      // 长按触发
      msgEl.classList.add('pressing');
      setTimeout(() => msgEl.classList.remove('pressing'), 200);
      showContextMenu(longPressStartX, longPressStartY, content, role, msgEl);
      if (navigator.vibrate) navigator.vibrate(15);  // 触觉反馈
    }, LONG_PRESS_DURATION);
  }, { passive: true });

  msgEl.addEventListener('touchmove', (e) => {
    if (longPressTimer) {
      const t = e.touches[0];
      const dx = Math.abs(t.clientX - longPressStartX);
      const dy = Math.abs(t.clientY - longPressStartY);
      if (dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }
  }, { passive: true });

  msgEl.addEventListener('touchend', () => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  });

  msgEl.addEventListener('touchcancel', () => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  });

  // 桌面端：左键长按（备选）
  msgEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;  // 仅左键
    longPressStartX = e.clientX;
    longPressStartY = e.clientY;
    longPressTimer = setTimeout(() => {
      showContextMenu(longPressStartX, longPressStartY, content, role, msgEl);
    }, LONG_PRESS_DURATION);
  });

  msgEl.addEventListener('mousemove', (e) => {
    if (longPressTimer) {
      const dx = Math.abs(e.clientX - longPressStartX);
      const dy = Math.abs(e.clientY - longPressStartY);
      if (dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }
  });

  msgEl.addEventListener('mouseup', () => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  });
}

// ============ 显示/隐藏上下文菜单 ============
function showContextMenu(x, y, content, role, msgEl) {
  currentContextContent = content;
  currentContextRole = role;
  currentContentEl = msgEl;
  suppressNextClick = true;  // 抑制长按后的下一个 click 事件
  const menu = $('context-menu');

  // 清理子菜单状态
  menu.querySelectorAll('.has-submenu').forEach(it => {
    it.classList.remove('open', 'open-right');
  });

  // "重新生成" 仅 AI 消息可用
  const regenItem = $('ctx-regenerate');
  if (regenItem) {
    if (role === 'assistant') regenItem.classList.remove('disabled');
    else regenItem.classList.add('disabled');
  }

  menu.style.display = 'block';
  // 先显示以便测量尺寸
  menu.style.left = '0px';
  menu.style.top = '0px';

  const rect = menu.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // 边界检测
  if (x + w > vw - 8) x = vw - w - 8;
  if (y + h > vh - 8) y = vh - h - 8;
  if (x < 8) x = 8;
  if (y < 8) y = 8;

  menu.style.left = x + 'px';
  menu.style.top = y + 'px';

  // ---------- 子菜单弹出方向边界检测 ----------
  // 默认：子菜单向左弹出（right:100%）。若左侧空间不足 220px，则改为向右弹出
  const subW = 220;  // 子菜单最小宽度
  const margin = 14;
  const spaceLeft = x - margin;
  const shareItem = $('ctx-share');
  if (shareItem) {
    // 计算分享项在菜单中的偏移（子菜单垂直对齐该菜单项）
    const shareRect = shareItem.getBoundingClientRect();
    const spaceRight = vw - (shareRect.right + margin);
    if (spaceLeft >= subW) {
      shareItem.classList.remove('open-right');
    } else if (spaceRight >= subW) {
      shareItem.classList.add('open-right');
    } else {
      // 左右都不够，选空间更大的一侧
      shareItem.classList.toggle('open-right', spaceRight > spaceLeft);
    }
  }
}

function hideContextMenu() {
  const menu = $('context-menu');
  menu.style.display = 'none';
  currentContextContent = '';
  currentContextRole = '';
  currentContentEl = null;
  // 清理子菜单展开状态
  menu.querySelectorAll('.has-submenu.open').forEach(it => it.classList.remove('open'));
}

// 长按/右键后抑制下一个 click 事件（防止立即关闭菜单或误操作）
let suppressNextClick = false;

// 点击外部关闭菜单
document.addEventListener('click', (e) => {
  if (suppressNextClick) { suppressNextClick = false; return; }
  const menu = $('context-menu');
  if (menu.style.display === 'block' && !menu.contains(e.target)) {
    hideContextMenu();
  }
});

// ESC 关闭
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideContextMenu();
});

// 绑定菜单项点击事件
document.addEventListener('click', (e) => {
  const item = e.target.closest('.ctx-item');
  if (!item) return;                              // 非菜单项点击
  if (item.classList.contains('has-submenu')) {
    // 有子菜单的：点击切换子菜单显示（移动端无 hover，需要点击触发展开）
    e.stopPropagation();
    // 先关闭其它展开的子菜单
    document.querySelectorAll('.has-submenu.open').forEach(sib => {
      if (sib !== item) sib.classList.remove('open');
    });
    item.classList.toggle('open');
    return;
  }
  const action = item.dataset.action;
  if (!action) return;
  handleContextAction(action);
  hideContextMenu();
});

// ============ 上下文菜单动作处理 ============
async function handleContextAction(action) {
  const content = currentContextContent;
  const role = currentContextRole;

  switch (action) {
    case 'copy':
      await copyText(content);
      break;
    case 'select-text':
      // 自动选中该消息文字，方便用户复制
      {
        const target = currentContentEl || document.body;
        const range = document.createRange();
        range.selectNodeContents(target);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        showToast('已选中文本，Ctrl+C 复制');
      }
      break;
    case 'regenerate':
      if (role === 'assistant') {
        showToast('正在重新生成回答...');
        // 在实际项目中这里应该触发重新生成，目前仅做提示
      }
      break;
    case 'share-image':
      await shareAsImage([{ role, content }]);
      break;
    case 'share-text':
      await copyText(content);
      showToast('已复制为文字');
      break;
  }
}

// ============ 通用复制方法 ============
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('已复制');
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制'); }
    catch (_) { showToast('复制失败'); }
    document.body.removeChild(ta);
  }
}

// ============ 分享为图片（单条消息快速版） ============
async function shareAsImage(msgs) {
  showToast('正在生成分享图片...');
  try {
    const blob = await generateLongImage(msgs);
    if (!blob) {
      throw new Error('Canvas 生成失败（可能内容过长或浏览器限制）');
    }

    const ts = new Date();
    const fname = `无极Agent对话_${ts.getFullYear()}${String(ts.getMonth()+1).padStart(2,'0')}${String(ts.getDate()).padStart(2,'0')}_${String(ts.getHours()).padStart(2,'0')}${String(ts.getMinutes()).padStart(2,'0')}.png`;
    const blobUrl = URL.createObjectURL(blob);

    // 显示预览覆盖层：用户可长按保存或下载
    const overlay = $('image-preview-overlay');
    const img = $('image-preview-img');
    const saveBtn = $('image-preview-save');
    const closeBtn = $('image-preview-close');

    img.src = blobUrl;
    overlay.style.display = 'flex';

    // 保存图片（桌面端下载，移动端提示长按）
    const onSave = () => {
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('图片已下载');
    };
    const onClose = () => {
      overlay.style.display = 'none';
      img.src = '';
      URL.revokeObjectURL(blobUrl);
      saveBtn.removeEventListener('click', onSave);
      closeBtn.removeEventListener('click', onClose);
    };

    saveBtn.addEventListener('click', onSave);
    closeBtn.addEventListener('click', onClose);
  } catch (err) {
    console.error('生成图片失败', err);
    showToast('生成图片失败: ' + (err.message || '未知错误'));
  }
}

// ============ 进度提示（避免用户空等待）============
let progressTimer = null;
let progressEl = null;
let thinkingStartTime = 0;

// ============ thinking 事件计时器（只显示一次，实时更新耗时）============
let thinkingEl = null;
let thinkingTimer = null;

function updateThinkingTimer() {
  if (!thinkingEl || !isRunning) {
    clearThinkingTimer();
    return;
  }
  const seconds = Math.round((Date.now() - thinkingStartTime) / 1000);
  // 保留原始消息前缀（如"💭 网络搜索助手正在思考中"），只更新耗时
  const baseText = thinkingEl.getAttribute('data-base') || '思考中';
  thinkingEl.textContent = baseText + '（已耗时 ' + seconds + ' 秒）';
  thinkingTimer = setTimeout(updateThinkingTimer, 1000);  // 每 1 秒更新
}

function clearThinkingTimer() {
  if (thinkingTimer) {
    clearTimeout(thinkingTimer);
    thinkingTimer = null;
  }
  if (thinkingEl) {
    thinkingEl.remove();
    thinkingEl = null;
  }
}

function startProgressTimer() {
  stopProgressTimer();
  thinkingStartTime = Date.now();
  // 5 秒后若无响应，显示"AI 正在思考中..."
  progressTimer = setTimeout(() => {
    if (!isRunning) return;
    progressEl = appendMessage('event', '⏳ AI 正在思考中...');
    updateProgress();
  }, 5000);
}

function updateProgress() {
  if (!isRunning || !progressEl) return;
  const seconds = Math.round((Date.now() - thinkingStartTime) / 1000);
  progressEl.textContent = '⏳ AI 正在思考中...（已思考 ' + seconds + ' 秒）';
  progressTimer = setTimeout(updateProgress, 5000);  // 每 5 秒更新
}

function stopProgressTimer() {
  if (progressTimer) {
    clearTimeout(progressTimer);
    progressTimer = null;
  }
  if (progressEl) {
    progressEl.remove();
    progressEl = null;
  }
  clearThinkingTimer();  // 同时清理 thinking 提示
  thinkingStartTime = 0;
}

// ============ Canvas 生成长图（分享功能核心） ============
async function generateLongImage(msgs) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);  // 限制 DPR 防止 canvas 超过浏览器尺寸上限
  const baseW = 750;  // 设计稿宽度（逻辑像素）
  const padding = 32;
  const avatarW = 48;
  const msgMaxW = baseW - padding * 2 - avatarW - 16;  // 气泡最大宽度
  const headerH = 96;   // 顶部标题栏高度
  const footerH = 72;   // 底部水印高度
  const bubblePadX = 18;
  const bubblePadY = 14;
  const lineH = 26;
  const fontSize = 18;
  const gap = 24;  // 消息间距

  // 先算每行字数（粗略），用离屏 canvas 度量
  const metricCanvas = document.createElement('canvas');
  const mctx = metricCanvas.getContext('2d');
  mctx.font = `${fontSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;

  // ---------- 计算每条消息的高度和拆分行数 ----------
  const layoutRows = [];
  let contentH = 0;

  for (const m of msgs) {
    const text = String(m.content || '').replace(/<[^>]+>/g, '');  // 去除 HTML 标签
    const lines = splitTextToLines(mctx, text, msgMaxW - bubblePadX * 2);
    const bubbleH = lines.length * lineH + bubblePadY * 2;
    const rowH = Math.max(bubbleH, avatarW + 8) + gap;
    layoutRows.push({ msg: { ...m, content: text }, lines, bubbleH, rowH });
    contentH += rowH;
  }

  // ---------- 设定 canvas 尺寸（限制最大高度防止浏览器溢出）----------
  const MAX_CANVAS_H = 16000;  // 浏览器 canvas 最大高度安全值
  let totalH = headerH + contentH + footerH + gap;
  let scale = 1;
  const pixelH = totalH * DPR;
  if (pixelH > MAX_CANVAS_H) {
    scale = MAX_CANVAS_H / pixelH;
    totalH = totalH * scale;
  }

  canvas.width = Math.round(baseW * DPR * scale);
  canvas.height = Math.round(totalH * DPR * scale);
  canvas.style.width = baseW + 'px';
  canvas.style.height = totalH + 'px';
  if (scale < 1) {
    ctx.scale(DPR * scale, DPR * scale);
  } else {
    ctx.scale(DPR, DPR);
  }

  // ---------- 背景：渐变浅灰 ----------
  const bg = ctx.createLinearGradient(0, 0, 0, totalH);
  bg.addColorStop(0, '#f5f7fa');
  bg.addColorStop(1, '#ebeef3');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, baseW, totalH);

  // ---------- 顶部标题栏 ----------
  const headerBg = ctx.createLinearGradient(0, 0, baseW, 0);
  headerBg.addColorStop(0, '#0a84ff');
  headerBg.addColorStop(1, '#34c759');
  ctx.fillStyle = headerBg;
  ctx.fillRect(0, 0, baseW, headerH);
  // 标题文字
  ctx.fillStyle = '#fff';
  ctx.font = `bold 24px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.fillText('无极 Agent 对话', padding + 8, headerH / 2 - 10);
  // 副标题
  ctx.font = `13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const nowStr = new Date().toLocaleString('zh-CN');
  ctx.fillText('导出时间：' + nowStr, padding + 8, headerH / 2 + 18);

  // ---------- 消息绘制 ----------
  let y = headerH + gap;
  for (const row of layoutRows) {
    const isUser = row.msg.role === 'user';
    const avatarX = isUser ? baseW - padding - avatarW : padding;
    const bubbleX = isUser
      ? baseW - padding - avatarW - 16 - (bubblePadX * 2 + measureLinesWidth(mctx, row.lines) + bubblePadX * 2)  // 右对齐会很复杂，改用固定左端
      : padding + avatarW + 16;

    // 为简化：用户消息靠右侧绘制，左边界 = baseW - padding - 最大气泡宽 - avatarW - 16
    const bubbleLeft = isUser
      ? baseW - padding - msgMaxW - avatarW - 16
      : padding + avatarW + 16;

    // 头像
    drawRoundRect(ctx, avatarX, y + 4, avatarW, avatarW, 24);
    ctx.fillStyle = isUser ? '#0a84ff' : '#fff';
    ctx.fill();
    // 头像文字
    ctx.fillStyle = isUser ? '#fff' : '#0a84ff';
    ctx.font = `bold 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isUser ? '我' : 'AI', avatarX + avatarW / 2, y + 4 + avatarW / 2);
    ctx.textAlign = 'start';

    // 气泡背景
    const bubbleW = Math.min(msgMaxW, bubblePadX * 2 + measureLinesWidth(mctx, row.lines));
    const bx = isUser ? (baseW - padding - avatarW - 16 - bubbleW) : bubbleLeft;
    const by = y + 4;

    drawRoundRect(ctx, bx, by, bubbleW, row.bubbleH, 14);
    if (isUser) {
      const g = ctx.createLinearGradient(bx, by, bx + bubbleW, by);
      g.addColorStop(0, '#0a84ff');
      g.addColorStop(1, '#34a3ff');
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = '#ffffff';
    }
    ctx.fill();
    // 气泡阴影
    if (!isUser) {
      ctx.strokeStyle = '#e3e6eb';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 气泡文字
    ctx.fillStyle = isUser ? '#fff' : '#1d1d1f';
    ctx.font = `${fontSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textBaseline = 'top';
    let lx = bx + bubblePadX;
    let ly = by + bubblePadY;
    for (const ln of row.lines) {
      ctx.fillText(ln, lx, ly);
      ly += lineH;
    }

    y += row.rowH;
  }

  // ---------- 底部水印 ----------
  ctx.fillStyle = '#8e8e93';
  ctx.font = `13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.fillText('—— 无极 Agent · 由 DeepSearch Pro 生成 ——', baseW / 2, y + (footerH / 2), baseW - padding * 2);
  ctx.textAlign = 'start';

  // 使用 toBlob 替代 toDataURL（内存占用更低，移动端大 canvas 兼容性更好）
  return new Promise((resolve) => {
    canvas.toBlob((blob) => {
      if (!blob || blob.size === 0) {
        console.error('toBlob 返回空数据');
        resolve(null);
      } else {
        resolve(blob);
      }
    }, 'image/png', 0.92);
  });
}

// 辅助：将文字拆成多行（按宽度 + 换行符）
function splitTextToLines(mctx, text, maxW) {
  const result = [];
  const paragraphs = String(text).split('\n');
  for (const para of paragraphs) {
    if (para === '') { result.push(''); continue; }
    let line = '';
    for (const ch of para) {
      const tryLine = line + ch;
      const w = mctx.measureText(tryLine).width;
      if (w > maxW && line) {
        result.push(line);
        line = ch;
      } else {
        line = tryLine;
      }
    }
    if (line) result.push(line);
  }
  return result.length ? result : [''];
}

// 辅助：计算多行文最大宽度
function measureLinesWidth(mctx, lines) {
  let maxW = 0;
  for (const l of lines) maxW = Math.max(maxW, mctx.measureText(l).width);
  return maxW;
}

// 辅助：圆角矩形路径
function drawRoundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ 文件上传 ============
function openUploadModal() {
  if (!currentSessionId) { alert('请先选择或新建会话'); return; }
  $('upload-modal').classList.add('show');
  $('upload-result').innerHTML = '';
}
function closeModal(id) { $(id).classList.remove('show'); }

async function uploadFiles(fileList) {
  if (!currentSessionId) { alert('请先选择会话'); return; }
  const files = Array.from(fileList);
  if (files.length === 0) return;
  const fd = new FormData();
  files.forEach(f => fd.append('files', f));
  fd.append('thread_id', currentSessionId);
  $('upload-result').innerHTML = '<div>上传中...</div>';
  try {
    const r = await fetch('/api/upload', {method:'POST', body: fd});
    const data = await r.json();
    $('upload-result').innerHTML = `<div class="msg system">✅ 已上传 ${data.files.length} 个文件：${data.files.join(', ')}</div>`;
  } catch (e) {
    $('upload-result').innerHTML = `<div class="msg error">上传失败: ${e.message}</div>`;
  }
}

// ============ 文件列表 ============
async function openFilesModal() {
  if (!currentSessionId) { alert('请先选择或新建会话'); return; }
  $('files-modal').classList.add('show');
  $('files-list').innerHTML = '<div>加载中...</div>';
  // 拼接 output/session_xxx 目录路径
  const path = `/output/session_${currentSessionId}`;
  try {
    const r = await fetch(`/api/files?path=${encodeURIComponent(path)}`);
    const data = await r.json();
    if (data.error) { $('files-list').innerHTML = `<div class="msg error">${data.error}</div>`; return; }
    const files = data.files || [];
    if (files.length === 0) { $('files-list').innerHTML = '<div>暂无文件</div>'; return; }
    $('files-list').innerHTML = files.map(f => `
      <div class="file-row">
        <span>${escapeHtml(f.name)} <span class="badge">${formatSize(f.size)}</span></span>
        <a href="/api/download?path=${encodeURIComponent(f.path)}" target="_blank">下载</a>
      </div>
    `).join('');
  } catch (e) {
    $('files-list').innerHTML = `<div class="msg error">加载失败: ${e.message}</div>`;
  }
}

function formatSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(1) + ' MB';
}
